#   tag = "tags"
#   author = "authors"

# Social links
# Social links render as words, not icons — the design system has no icon set.
# The `icon` field held Font Awesome classes and is gone with Font Awesome (#54).
[[params.social]]
  name = "GitHub"
  weight = 1
  url = "https://github.com/britt/"
[[params.social]]
  name = "LinkedIn"
  weight = 2
  url = "https://www.linkedin.com/in/brittcrawford/"

