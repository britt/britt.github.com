baseURL = 'https://brittcrawford.com/'
title = 'brittcrawford.com'
locale = 'en-US'
theme = "hugo-coder"
defaultcontentlanguage = "en"

pagination.pagerSize = 20

[markup.highlight]
style = "github-dark"

[markup.goldmark.renderer]
unsafe = true

# Hugo version gate. Fails the build on an unpinned or non-extended toolchain
# rather than producing a subtly different site. Keep in step with .hugoversion
# and .tool-versions.
[module]
  [module.hugoVersion]
    extended = true
    min = "0.163.0"

  # The design system export in design/ is the single source of truth for
  # tokens. Mounting it into assets/ lets Hugo Pipes consume it directly, so
  # refreshing the design system is a matter of replacing design/ — there is no
  # transcribed second copy to drift out of step.
  #
  # Declaring a mount for a target replaces that target's default mount, so
  # assets/ is re-declared here alongside it.
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "design/tokens"
    target = "assets/ds"

[params]
  author = "Britt Crawford"
  description = "Britt Crawford's website"
  keywords = "blog,personal,sandgarden,home cooked software,recipes,cocktails"
  info = "Working to build [Sandgarden](https://www.sandgarden.com)."
  #avatarurl = "images/avatar.jpg"
  gravatar = "britt.v.crawford@gmail.com"
  favicon = "/img/favicon.png"
  favicon_32 = "/img/favicon.png"
  favicon_16 = "/img/favicon.png"
  touchicon = "/img/apple-touch-icon-144-precomposed.png"
  since = 1999
  enableTwemoji = true
  colorScheme = "auto"
  hidecolorschemetoggle = false

