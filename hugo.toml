baseURL = 'https://brittcrawford.com/'
title = 'brittcrawford.com'
locale = 'en-US'
defaultcontentlanguage = "en"

pagination.pagerSize = 20

[markup.highlight]
  # Emit Chroma's semantic classes and let design/tokens/syntax.css colour
  # them, so code themes with everything else instead of being a separate
  # hardcoded surface. `style` is deliberately absent: it only applies when
  # noClasses is true, and leaving it set would be a config line that reads as
  # if it does something.
  noClasses = false
  lineNumbersInTable = true

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.parser]
  # A standalone image becomes a <figure>, which is not valid inside a <p>.
  # Leaving Goldmark's default wrapping on would nest one inside the other.
  wrapStandAloneImageWithinParagraph = false

# Hugo version gate. Fails the build on an unpinned or non-extended toolchain
# rather than producing a subtly different site. Keep in step with .hugoversion
# and .tool-versions.
[module]
  [module.hugoVersion]
    extended = true
    min = "0.163.0"

  # The design system export in design/ is the single source of truth for
  # tokens. Mounting it into assets/ lets Hugo Pipes consume it directly, so
  # refreshing the design system is a matter of replacing design/ — there is no
  # transcribed second copy to drift out of step.
  #
  # Declaring a mount for a target replaces that target's default mount, so
  # assets/ is re-declared here alongside it.
  # hugo-coder is imported as a module rather than set via `theme` so that only
  # the parts still in use are mounted. After the cutover the site compiles
  # none of the theme's SCSS and uses none of its static files — which is where
  # Font Awesome's three woff2 files live. Importing layouts and i18n only
  # keeps 984 KB of unreferenced fonts out of the build (#54).
  [[module.imports]]
    path = "hugo-coder"
    [[module.imports.mounts]]
      source = "layouts"
      target = "layouts"
    [[module.imports.mounts]]
      source = "i18n"
      target = "i18n"

  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "design/tokens"
    target = "assets/ds"
  # Content images are referenced by absolute URL (/img/...) and live in
  # static/, which bypasses Hugo Pipes entirely. Mounting them into assets/ as
  # well lets the image render hook resolve one as a resource and read its
  # intrinsic dimensions, so the browser can reserve the box before the image
  # arrives (#55). They keep their static/ URLs.
  [[module.mounts]]
    source = "static/img"
    target = "assets/img"

[params]
  author = "Britt Crawford"
  description = "Britt Crawford's website"
  keywords = "blog,personal,sandgarden,home cooked software,recipes,cocktails"
  info = "Working to build [Sandgarden](https://www.sandgarden.com)."
  #avatarurl = "images/avatar.jpg"
  # The portrait is self-hosted at assets/img/avatar.png — see
  # layouts/partials/home/avatar.html. `gravatar` is deliberately unset so the
  # theme's partial cannot reintroduce the third-party request.
  favicon = "/img/favicon.png"
  favicon_32 = "/img/favicon.png"
  favicon_16 = "/img/favicon.png"
  touchicon = "/img/apple-touch-icon-144-precomposed.png"
  since = 1999
  enableTwemoji = true
  # Which design system variant to render. Emitted as <html data-theme>.
  designTheme = "playful"
  colorScheme = "auto"
  hideColorSchemeToggle = false

  # customCSS = ["css/custom.css"]
  # customSCSS = ["scss/custom.scss"]
  # customJS = ["js/custom.js"]

# [taxonomies]
