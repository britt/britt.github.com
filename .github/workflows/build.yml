name: build

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The theme is vendored, not a submodule — see README. Nothing to init.
      - name: Read the pinned Hugo version
        id: hugo
        run: echo "version=$(cat .hugoversion)" >> "$GITHUB_OUTPUT"

      - name: Install Hugo ${{ steps.hugo.outputs.version }} extended
        env:
          VERSION: ${{ steps.hugo.outputs.version }}
        run: |
          set -euo pipefail
          url="https://github.com/gohugoio/hugo/releases/download/v${VERSION}/hugo_extended_${VERSION}_linux-amd64.deb"
          curl --fail --silent --show-error --location -o /tmp/hugo.deb "$url"
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      # --panicOnWarning is the point of this job: a deprecation warning today
      # is a broken page on the next Hugo release. It is also what catches a
      # template that no longer resolves.
      - name: Build
        run: hugo --gc --minify --printPathWarnings --panicOnWarning

      - name: Check internal links
        run: python3 scripts/check-links.py public

      # Dropping a stylesheet produces no build error — an element just stops
      # being styled. This fails on any class the site emits that nothing
      # styles and that is not recorded as deliberate.
      - name: Check style coverage
        run: node scripts/style-coverage.mjs public

      # A token nobody reads is a design decision that did not ship, and a rule
      # reading a token nobody defines silently drops the whole declaration.
      # Neither produces an error on its own.
      - name: Check token coverage
        run: node scripts/token-coverage.mjs public

      - name: Assert the theme was not edited
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${{ github.base_ref || github.event.repository.default_branch }}"
          if ! git diff --quiet FETCH_HEAD -- themes/; then
            echo "::error::themes/ was modified. Shadow the file from the project root instead — see README."
            git diff --stat FETCH_HEAD -- themes/
            exit 1
          fi

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/visual/package-lock.json

      - name: Read the pinned Hugo version
        id: hugo
        run: echo "version=$(cat .hugoversion)" >> "$GITHUB_OUTPUT"

      - name: Install Hugo ${{ steps.hugo.outputs.version }} extended
        env:
          VERSION: ${{ steps.hugo.outputs.version }}
        run: |
          set -euo pipefail
          url="https://github.com/gohugoio/hugo/releases/download/v${VERSION}/hugo_extended_${VERSION}_linux-amd64.deb"
          curl --fail --silent --show-error --location -o /tmp/hugo.deb "$url"
          sudo dpkg -i /tmp/hugo.deb

      - name: Install test dependencies
        working-directory: tests/visual
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      # Visual regression is not run here: its baseline is regenerated from a
      # git ref rather than committed (see tests/visual/README.md), and a
      # baseline captured on a different Chromium build is not comparable.
      # These are the behavioural assertions, which are.
      - name: Serve the site
        run: |
          hugo server --bind 127.0.0.1 --port 1313 --renderToMemory &
          for _ in $(seq 1 40); do curl -fsS -o /dev/null http://127.0.0.1:1313/ && break; sleep 0.5; done
          curl -fsS -o /dev/null http://127.0.0.1:1313/

      # Colour-scheme behaviour and the accessibility sweep. axe measures
      # contrast against what an element is actually drawn on, which is the
      # only way to get it right across a two-theme matrix.
      - name: Behaviour and accessibility
        working-directory: tests/visual
        env:
          BASE: http://127.0.0.1:1313
        run: npm test

      # Three engines x six viewports x six pages. WebKit earns its place here:
      # half this site's content is iOS Shortcuts, so its audience skews Apple,
      # and clamp(), 100dvh and :focus-visible are where it differs most.
      - name: Responsive and cross-browser
        working-directory: tests/visual
        env:
          BASE: http://127.0.0.1:1313
        run: npm run test:responsive
