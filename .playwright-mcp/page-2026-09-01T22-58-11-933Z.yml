            - text: "- Turn any web page into a podcast episode, with decently human sounding voices."
            - emphasis [ref=e28]: (It just reads it to you in a nice human voice, no AI commentary or nonsense like that.)
          - listitem [ref=e29]:
            - link "lotsofcsvs.com↗" [ref=e30] [cursor=pointer]:
              - /url: https://www.lotsofcsvs.com
            - text: "- a"
            - strong [ref=e31]: small data
            - text: warehouse built with CSV and HTTP as its API. It is intentionally as barebones as possible. It aims to be a simple API for recording and fetching data that works with everything.
          - listitem [ref=e32]:
            - link "Agent Skills↗" [ref=e33] [cursor=pointer]:
