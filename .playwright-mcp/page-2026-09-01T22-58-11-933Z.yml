            - strong [ref=e52]: I didn’t create this one
            - text: but I have found it very useful, and I did fix a bug where sometimes it would not create the day’s note.
        - blockquote [ref=e53]:
          - paragraph [ref=e54]: This shortcut helps someone with short term memory loss log what happens throughout the day. It helps them keep track of what they have done, who they have met, etc. It will ask you what you want to remember. If run for the first time for the day, it will create a new note and log the input, with the time. It it’s been run already, it will grab the note and append the the note with the time and new content.
