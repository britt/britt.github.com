            - text: "- A GitHub actions that watches your Obsidian notes for @mentions and dispatches an agent like Claude handle your request and commit changes back to the note."
            - code [ref=e36]: "@claude find a list of hot springs in Oregon. Include a picture, link, and description for each."
          - listitem [ref=e37]:
            - link "LLPM↗" [ref=e38] [cursor=pointer]:
